<text x="1134" y="945" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#a6bdce" text-anchor="start">也可能与两者都不相似</text>
<text x="1605" y="1085" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#a6bdce" text-anchor="middle">虚线表示备选关系：至多选一条，也可能均不匹配</text>
<rect x="70" y="1180" width="2060" height="146" rx="18" fill="#3b3831"/>
<text x="106" y="1232" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="29" font-weight="650" fill="#e9bc79" text-anchor="start">核心错位</text>
<text x="300" y="1232" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="29" font-weight="550" fill="#eaf1f8" text-anchor="start">评价比较的是“缺陷类型是否包含”，算法比较的是“连通区域能否逐块匹配”。</text>
<text x="106" y="1285" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#e9bc79" text-anchor="start">区域粒度不一致 → 正样本相似度可能被低估 → 检索排序与标签预期可能不一致。</text>
<text x="70" y="1376" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#a6bdce" text-anchor="start">示意说明：颜色用于区分语义，实际连通域提取只看二值缺陷是否相连；当前数据不提供区域级语义真值。</text>
<text x="70" y="1413" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#a6bdce" text-anchor="start">这不是“必然低分”：候选多出的区域不直接扣分，最终结果仍取决于合并区域的特征、匹配阈值与聚合规则。</text>
</svg>