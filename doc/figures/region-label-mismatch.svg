<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1440" viewBox="0 0 2200 1440" role="img" aria-labelledby="title desc">
<title id="title">区域划分与标签语义不一致：标签正样本不一定有可一一对应的区域</title>
<desc id="desc">查询图有A1、B1、C1三种语义缺陷，但B1与C1接触，连通域提取只得到A1与BC1两个区域。正样本有A2、B2、C2三个分离区域。两图的标签集合都为A、B、C，标签包含率为1；然而BC1不能在一对一匹配中同时匹配B2与C2，区域分数可能偏离标签预期，但并非必然降低。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8caec8"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e9bc79"/></marker></defs>
<rect width="2200" height="1440" fill="#152a3b"/>
<text x="70" y="85" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="48" font-weight="650" fill="#eaf1f8" text-anchor="start">实验设计问题：区域划分与标签语义不一致</text>
<text x="70" y="134" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#a6bdce" text-anchor="start">标签认为是完整覆盖的正样本，算法却未必能建立逐区域的语义对应。</text>
<rect x="70" y="172" width="2060" height="100" rx="18" fill="#203e50"/>
<text x="104" y="233" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="29" font-weight="600" fill="#51c7b4" text-anchor="start">标签评价</text>
<text x="310" y="233" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#eaf1f8" text-anchor="start">TQ = TP = {A, B, C}</text>
<path d="M815 219H925" fill="none" stroke="#8caec8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="965" y="233" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#51c7b4" text-anchor="start">完整覆盖正例</text>
<text x="1265" y="233" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#eaf1f8" text-anchor="start">R(Q, P) = 3 / 3 = 1</text>
<text x="2098" y="233" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#a6bdce" text-anchor="end">A / B / C 为类型，₁ / ₂ 区分图中的实例</text>
<text x="70" y="326" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#eaf1f8" text-anchor="start">01  缺陷图：按语义看有三类</text>
<text x="490" y="326" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#eaf1f8" text-anchor="start">02  连通域提取：按像素相连分块</text>
<text x="1110" y="326" font-family="PingFang SC, Heiti SC, STHeiti, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#eaf1f8" text-anchor="start">03  一对一匹配：区域不能一对多</text>
